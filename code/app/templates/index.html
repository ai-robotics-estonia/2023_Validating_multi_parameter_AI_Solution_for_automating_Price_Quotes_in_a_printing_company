<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Price Quote Pipeline</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="app-container">
        <h1>AI Price Quote Pipeline</h1>
        <div class="button-container">
            <button id="startButton" onclick="startProcess()">
                <span class="button-text"><i class="fas fa-play"></i> Start</span>
                <span class="spinner hidden"></span>
            </button>
            <button id="resetButton" onclick="resetProcess()"><i class="fas fa-redo"></i> Reset</button>
        </div>
        <div id="statusContainer">
            <div id="step1" class="step">
                <h3><i class="fas fa-search"></i> Step 1: Investigating Input Data</h3>
                <div class="step-content"></div>
            </div>
            <div id="step2" class="step">
                <h3><i class="fas fa-database"></i> Step 2: Finding Similar Data</h3>
                <div class="step-content"></div>
            </div>
            <div id="step3" class="step">
                <h3><i class="fas fa-table"></i> Step 3: Analyzing Data</h3>
                <div class="step-content"></div>
            </div>
            <div id="step4" class="step">
                <h3><i class="fas fa-chart-bar"></i> Step 4: Printing Summary Table</h3>
                <div class="step-content"></div>
            </div>
            <div id="step5" class="step">
                <h3><i class="fas fa-flag-checkered"></i> Step 5: Final Answer</h3>
                <div class="step-content"></div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
